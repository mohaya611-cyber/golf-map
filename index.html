<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLF MAP</title>
<meta name="theme-color" content="#D71920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GOLF MAP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen field tool — white header with logo, full-bleed map, floating panels, bottom tab bar. Palette: Red Crescent red on red-tinted neutrals. */
:root{
  --red:#D71920; --red-ink:#A3121A; --red-deep:#7A0C12; --red-soft:#FCE9EA; --red-tint:#F7D3D5;
  --bg:#FAF6F6; --surface:#FFFFFF; --fg:#22161A; --muted:#6F5C5F; --line:#ECDCDD; --mapbg:#EFE6E6;
  --ok:#1F7A45; --ok-soft:#E1F3E8; --warn:#9A5600; --warn-soft:#FDF1DC;
  --c-ems:#D71920; --c-gate:#9E1B21; --c-toilet:#5A4447; --c-hotel:#C9565C; --c-facility:#8A7275; --c-landmark:#E2868B; --c-cartstop:#2A1A1C;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 6px 24px rgba(90,10,14,.16);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#FF4A52; --red-ink:#FF9095; --red-deep:#FFB3B6; --red-soft:#3A1418; --red-tint:#5A1C22;
  --bg:#130B0C; --surface:#1F1416; --fg:#F6ECED; --muted:#B59FA2; --line:#3A2A2D; --mapbg:#24191B;
  --ok:#55C987; --ok-soft:#10301F; --warn:#F2B04A; --warn-soft:#33260E;
  --c-ems:#FF4A52; --c-gate:#E0454C; --c-toilet:#A88E91; --c-hotel:#F07C82; --c-facility:#C2A9AC; --c-landmark:#FFB0B4; --c-cartstop:#6B5558;
  --shadow:0 6px 24px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#FF4A52; --red-ink:#FF9095; --red-deep:#FFB3B6; --red-soft:#3A1418; --red-tint:#5A1C22;
  --bg:#130B0C; --surface:#1F1416; --fg:#F6ECED; --muted:#B59FA2; --line:#3A2A2D; --mapbg:#24191B;
  --ok:#55C987; --ok-soft:#10301F; --warn:#F2B04A; --warn-soft:#33260E;
  --c-ems:#FF4A52; --c-gate:#E0454C; --c-toilet:#A88E91; --c-hotel:#F07C82; --c-facility:#C2A9AC; --c-landmark:#FFB0B4; --c-cartstop:#6B5558;
  --shadow:0 6px 24px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
.app,.mapwrap,#overlay{overflow:hidden}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto}
#overlay>.top{pointer-events:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
header>*{min-width:0}
.hbtn{flex:none}
header{background:var(--surface);border-bottom:3px solid var(--red);padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.brand b{display:block;font-size:17px;letter-spacing:.06em;font-family:var(--mono);line-height:1.2;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:var(--red-soft);border:0;color:var(--red-ink);border-radius:10px;height:38px;padding:0 10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mapwrap{position:relative;overflow:hidden;background:var(--mapbg)}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#viewport.placing{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
#stage svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{direction:ltr;position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;display:flex;align-items:center;gap:4px}
.mk .dot{min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--cat);color:#fff;font:600 11.5px/24px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.25);margin-left:-12px;margin-top:-12px}
.mk.ems .dot{border-radius:6px}
.mk .lbl{margin-top:-12px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);display:none}
.mk.showlbl .lbl,.mk.sel .lbl{display:block}
.mk.sel .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--red);transform:scale(1.2)}
.me{position:absolute;left:0;top:0;pointer-events:none}
.me i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.me .acc{position:absolute;border-radius:50%;background:rgba(215,25,32,.14);border:1px solid rgba(215,25,32,.4)}
.me .hd{position:absolute;width:0;height:0;margin:-30px 0 0 -8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--red);transform-origin:8px 30px}
.calpt{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid var(--red);border-radius:50%;background:var(--surface);pointer-events:none}
.stop{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:4px;background:var(--red-deep);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.pulse{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--red);pointer-events:none;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border:1px solid currentColor;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;line-height:1.5}
.top{position:absolute;z-index:6;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.top>.banner{pointer-events:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--red);border-radius:14px;padding:0 12px;height:56px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:18px;font-weight:600;outline:none;height:100%}
.search input::placeholder{color:var(--muted);font-weight:500}
.iconbtn{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.results{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);max-height:46vh;overflow:auto}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px}
.res:last-child{border-bottom:0}
.res:active{background:var(--red-soft)}
.badge{flex:none;min-width:42px;height:32px;border-radius:8px;background:var(--cat);color:#fff;font:600 13px/32px var(--mono);text-align:center;padding:0 6px}
.res b{display:block;font-size:16px}
.res small{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="true"]{border-color:var(--cat)}
.fab{position:absolute;z-index:6;inset-inline-end:max(12px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:8px}
.fab button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--fg)}
.fab button.gps{color:var(--red)}
.fab button.gps.on{background:var(--red);color:#fff;border-color:var(--red)}
.sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2);max-height:72%;overflow:auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;gap:12px;align-items:flex-start}
.sh-head .badge{min-width:54px;height:44px;line-height:44px;font-size:17px;border-radius:10px}
.sh-head h2{margin:0;font-size:20px;line-height:1.3;text-wrap:balance}
.sh-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.close{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.fact span{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-size:14px}
.note{font-size:14px;line-height:1.6;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;height:58px;border-radius:14px;border:0;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.red{background:var(--red);color:#fff}
.btn.deep{background:var(--red-deep);color:var(--surface)}
.btn.ghost{background:var(--red-soft);color:var(--red-ink)}
.btn.small{height:44px;font-size:14.5px;min-width:110px;border-radius:11px}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.45}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.5}
.steps li:last-child{border-bottom:0}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:600 13px var(--mono)}
.steps .n.walk{background:var(--surface);color:var(--red);border:2px dashed var(--red)}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;margin:10px 0;font-weight:500}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.err{background:var(--red-soft);color:var(--red-ink)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--red-soft);color:var(--red-ink)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--red)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.panel h3{margin:6px 0 8px;font-size:16px}
.panel h4{margin:18px 0 6px;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;height:38px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column}
.empty{color:var(--muted);font-size:14px;line-height:1.6;padding:12px 0}
.quiz{position:absolute;z-index:7;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--red)}
.quiz .q{font-size:18px;font-weight:700}
.quiz .score{font:600 13px var(--mono);color:var(--muted)}
.form{display:grid;gap:10px;margin-top:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--fg);font-weight:500;width:100%}
.form textarea{height:84px;padding:10px 12px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pathrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow b{flex:1;min-width:0;font-size:14.5px}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.closed{background:var(--red-soft);color:var(--red-ink)}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:34px;padding:0 10px;font-size:13px;font-weight:600}
.hint{position:absolute;z-index:7;left:50%;transform:translateX(-50%);top:12px;background:var(--fg);color:var(--surface);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
.hint button{border:0;border-radius:8px;height:34px;padding:0 12px;font-weight:700;background:var(--surface);color:var(--fg)}
.hint button.pri{background:var(--red);color:#fff}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%;text-align:center}
.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(30,5,8,.45);color:#fff;font-weight:700;font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.about{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.about img{width:72px;height:72px;border-radius:50%;background:#fff;flex:none}
.about b{display:block;font-size:17px;color:var(--red)}
.about span{font-size:13px;color:var(--muted)}
</style>
</head>

const AR_D="٠١٢٣٤٥٦٧٨٩",FA_D="۰۱۲۳۴۵۶۷۸۹";
const STOP=new Set(["باب","بوابه","بوابات","رقم","gate","door","bab","no","number","num"]);
function norm(s){s=String(s||"").toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
 .replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).replace(/[۰-۹]/g,d=>FA_D.indexOf(d)).replace(/[^\p{L}\p{N}\s]/gu," ");
 return s.split(/\s+/).filter(Boolean).map(w=>w.length>3?w.replace(/^ال/,""):w).join(" ")}
function search(q,list){
 const nq=norm(q); if(!nq)return[];
 const toks=nq.split(" ").filter(w=>!STOP.has(w)); const all=toks.length?toks:nq.split(" ");
 const out=[];
 for(const p of list){
  const num=norm(p.num), hay=norm([p.nameAr,p.nameEn,p.num,p.aliases,T.ar.cat1[p.cat],T.en.cat1[p.cat]].join(" "));
  let sc=0;
  if(all.length===1&&/^\d+$/.test(all[0])){ if(num===all[0])sc=100; else if(num.startsWith(all[0]))sc=55; else if((" "+hay+" ").includes(" "+all[0]+" "))sc=45; else if(hay.includes(all[0]))sc=20; }
  else{ let ok=true; for(const w of all){const i=hay.indexOf(w); if(i<0){ok=false;break} sc+=(i===0||hay[i-1]===" ")?20:8;} if(!ok)sc=0; if(sc&&num&&all.includes(num))sc+=40; }
  if(sc)out.push([sc,p]);
 }
 return out.sort((a,b)=>b[0]-a[0]||String(a[1].num).localeCompare(String(b[1].num),undefined,{numeric:true})).slice(0,25).map(x=>x[1]);
}

/* ---------- GPS & calibration ---------- */
function geoFit(){
 const P=(ST.calib||[]).filter(p=>typeof p.lat==="number");if(P.length<2)return null;
 const lat0=P[0].lat,lng0=P[0].lng,cl=Math.cos(lat0*Math.PI/180);
 const Z=P.map(p=>[(p.lng-lng0)*cl*111320,-(p.lat-lat0)*110574]),Wp=P.map(p=>[p.x*W(),p.y*H()]);
 const n=P.length,zb=[0,0],wb=[0,0];Z.forEach(z=>{zb[0]+=z[0]/n;zb[1]+=z[1]/n});Wp.forEach(w=>{wb[0]+=w[0]/n;wb[1]+=w[1]/n});
 let nr=0,ni=0,den=0;for(let i=0;i<n;i++){const zr=Z[i][0]-zb[0],zi=Z[i][1]-zb[1],wr=Wp[i][0]-wb[0],wi=Wp[i][1]-wb[1];nr+=wr*zr+wi*zi;ni+=wi*zr-wr*zi;den+=zr*zr+zi*zi}
 if(!den)return null;const a=[nr/den,ni/den],sc=Math.hypot(a[0],a[1]);if(!sc)return null;
 const b=[wb[0]-(a[0]*zb[0]-a[1]*zb[1]),wb[1]-(a[0]*zb[1]+a[1]*zb[0])];
 const f=(lat,lng)=>{const zr=(lng-lng0)*cl*111320,zi=-(lat-lat0)*110574;return[a[0]*zr-a[1]*zi+b[0],a[0]*zi+a[1]*zr+b[1]]};
 let err=0;P.forEach((p,i)=>{const w=f(p.lat,p.lng);err+=Math.hypot(w[0]-Wp[i][0],w[1]-Wp[i][1])/sc});
 return{f,pxPerM:sc,rot:Math.atan2(a[1],a[0]),err:n>2?err/n:null}}
function startGps(){
 if(!("geolocation" in navigator)){toast(t("gpsUnsupported"));return}
 if(S.gpsWatch!=null){navigator.geolocation.clearWatch(S.gpsWatch);S.gpsWatch=null;S.gps=null;if(S.me&&S.me.gps)S.me=null;toast(t("gpsOff"));render();return}
 let first=true;
 S.gpsWatch=navigator.geolocation.watchPosition(pos=>{
  const c=pos.coords;S.gps={lat:c.latitude,lng:c.longitude,acc:c.accuracy,heading:(c.heading!=null&&!isNaN(c.heading)&&c.speed>0.5)?c.heading:null};
  const g=geoFit();
  if(!g){if(first){toast(t("gpsNoCal"));first=false}renderMarkers();return}
  const [px,py]=g.f(S.gps.lat,S.gps.lng);const x=px/W(),y=py/H();
  if(x<-.05||y<-.05||x>1.05||y>1.05){if(first)toast(t("gpsOut"));first=false;renderMarkers();return}
  S.me={gps:true,x,y,acc:c.accuracy*g.pxPerM,heading:S.gps.heading!=null?S.gps.heading*Math.PI/180+g.rot:null};
  if(first){toast(t("gpsOn"));flyTo(x,y,V.s*1.4);first=false;header()}
  if(S.sel&&S.route)computeRoute(S.sel);
  renderMarkers();if(S.route)renderPaths()
 },err=>{toast(t("gpsDenied"));if(S.gpsWatch!=null)navigator.geolocation.clearWatch(S.gpsWatch);S.gpsWatch=null;render()},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
 render()}

/* ---------- routing on approved cart paths ---------- */
function buildGraph(){
 const nodes=[],adj=[];const snap=.012;
 const key=(x,y)=>{for(let i=0;i<nodes.length;i++){if(Math.hypot((nodes[i][0]-x)*W(),(nodes[i][1]-y)*H())<snap*Math.max(W(),H()))return i}nodes.push([x,y]);adj.push([]);return nodes.length-1};
 for(const p of paths()){if(p.status!=="approved"||p.type!=="cart"||!p.points)continue;let prev=null;
  for(const [x,y] of p.points){const i=key(x,y);if(prev!=null&&prev!==i){const d=Math.hypot((nodes[i][0]-nodes[prev][0])*W(),(nodes[i][1]-nodes[prev][1])*H());adj[i].push([prev,d,p]);adj[prev].push([i,d,p])}prev=i}}
 return{nodes,adj}}
function nearest(g,x,y){let bi=-1,bd=1e18;g.nodes.forEach((n,i)=>{const d=Math.hypot((n[0]-x)*W(),(n[1]-y)*H());if(d<bd){bd=d;bi=i}});return[bi,bd]}
function computeRoute(dest){
 S.route=null;const me=meXY();if(!me)return{err:"needMe"};
 const g=buildGraph();if(!g.nodes.length)return{err:"noNet"};
 const [a]=nearest(g,me.x,me.y),[b,db]=nearest(g,dest.x,dest.y);
 const dist=g.nodes.map(()=>1e18),prev=g.nodes.map(()=>null),via=g.nodes.map(()=>null),done=new Set();dist[a]=0;
 while(true){let u=-1,best=1e18;for(let i=0;i<dist.length;i++)if(!done.has(i)&&dist[i]<best){best=dist[i];u=i}if(u<0||u===b)break;done.add(u);for(const [v,w,p] of g.adj[u]){if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;via[v]=p}}}
 if(dist[b]>=1e18)return{err:"noNet"};
 const seq=[],names=[];for(let v=b;v!=null;v=prev[v]){seq.unshift(g.nodes[v]);if(via[v]&&!names.includes(via[v].name))names.unshift(via[v].name)}
 const startD=Math.hypot((g.nodes[a][0]-me.x)*W(),(g.nodes[a][1]-me.y)*H());
 const near=.015*Math.max(W(),H());
 S.route={cart:seq,names,stop:g.nodes[b],walkIn:startD>near?[[me.x,me.y],g.nodes[a]]:null,
  walkOut:(dest.cart==="yes"&&db<near*2)||db<near*.6?null:[g.nodes[b],[dest.x,dest.y]],me,dest};
 return S.route}

 <label class="btn deep small" style="cursor:pointer" for="mapFile">${t("a_upload")}</label><input id="mapFile" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" hidden>
 <h4>${t("a_places")} · <span class="mono">${ST.places.length}</span></h4>
 <div class="row"><button class="btn red small" type="button" id="addPlace">+ ${t("a_add")}</button></div>
 <h4>${t("a_paths")} · <span class="mono">${ST.paths.length}</span></h4>
 <div class="alert info" style="font-size:12.5px">${esc(t("pathRule"))}</div>
 <div class="row"><button class="btn deep small" type="button" id="drawPath">${t("a_draw")}</button></div>
 <div class="list">${ST.paths.map(p=>`<div class="pathrow"><b>${esc(p.name||"—")} <small style="color:var(--muted);font-weight:500">· ${p.type==="walk"?t("walkPath"):t("cartPath")}</small></b><span class="pill ${esc(p.status)}">${esc(t("s_"+p.status))}</span><button class="mini" type="button" data-pe="${esc(p.id)}">${t("edit")}</button></div>`).join("")}</div>
 <h4>${t("a_cal")} · <span class="mono">${(ST.calib||[]).length}</span></h4>
 <p class="note" style="margin:0 0 8px;color:var(--muted)">${esc(t("a_calHint"))}</p>
 ${g?(g.err!=null?`<div class="alert ok" style="font-size:13px">${t("a_calErr")}: <span class="mono">±${g.err.toFixed(1)} m</span></div>`:""):`<div class="alert warn" style="font-size:13px">${t("a_calNeed")}</div>`}
 <div class="list">${(ST.calib||[]).map((c,i)=>`<div class="pathrow"><b class="mono" style="font-size:13px" dir="ltr">${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}</b><button class="mini" type="button" data-cd="${i}">${t("del")}</button></div>`).join("")}</div>
 <div class="row" style="margin-top:8px"><button class="btn line small" type="button" id="addCal">+ ${t("a_calAdd")}</button></div>
 <h4>${t("a_import")}</h4><div class="form"><textarea id="impTxt" placeholder='[{"num":"21","nameAr":"باب ...","cat":"gate","zone":"east","x":0.62,"y":0.41}]' dir="ltr"></textarea></div><div class="row" style="margin-top:8px"><button class="btn line small" type="button" id="impBtn">${t("a_importBtn")}</button></div>
 <div class="row" style="margin-top:22px"><button class="btn line small" type="button" id="resetBtn" style="color:var(--red-ink)">${t("a_reset")}</button></div>
 </div>`;
 ov.innerHTML=h;
 document.getElementById("mapFile").onchange=e=>{const f=e.target.files[0];if(f)uploadMap(f)};
 document.getElementById("pkgFile").onchange=e=>{const f=e.target.files[0];if(f)importPkg(f)};
 document.getElementById("exportBtn").onclick=exportPkg;
 document.getElementById("addPlace").onclick=()=>{S.placing={};render()};
 document.getElementById("drawPath").onclick=()=>{S.drawing={points:[]};render()};
 document.getElementById("addCal").onclick=()=>{S.calibrating=true;render()};
 ov.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>{const p=ST.paths.find(x=>x.id===b.dataset.pe);if(p){S.editing={...p,_path:true};render()}});
 ov.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{ST.calib.splice(+b.dataset.cd,1);commit()});
 document.getElementById("impBtn").onclick=importJson;
 const rb=document.getElementById("resetBtn");rb.onclick=async()=>{if(rb.dataset.armed!=="1"){rb.dataset.armed="1";rb.textContent=t("a_resetConfirm");return}ST=emptyStore();await persist();S.me=null;ls.set("me",null);render();fitView(false)}}
const opt=(arr,v,lab)=>arr.map(k=>`<option value="${k}" ${v===k?"selected":""}>${esc(lab(k))}</option>`).join("");
const formHead=(title)=>`<div class="sheet panel" style="max-height:80%"><div class="grab"></div><div class="row" style="align-items:center"><h3 style="flex:1;margin:0">${title}</h3><button class="close" type="button" id="fCx">×</button></div>`;
function placeForm(p){return formHead(p._new?t("a_add"):t("edit"))+`
 <form class="form" id="pf"><div class="two"><label>${t("f_num")}<input id="f_num" value="${esc(p.num||"")}" dir="ltr"></label><label>${t("f_cat")}<select id="f_cat">${opt(CATS,p.cat,k=>T[S.lang].cat1[k])}</select></label></div>
 <label>${t("f_nameAr")}<input id="f_nameAr" value="${esc(p.nameAr||"")}" dir="rtl" required></label>
 <label>${t("f_nameEn")}<input id="f_nameEn" value="${esc(p.nameEn||"")}" dir="ltr"></label>
 <div class="two"><label>${t("f_zone")}<select id="f_zone">${opt(ZONES,p.zone,k=>T[S.lang].zones[k])}</select></label><label>${t("f_cart")}<select id="f_cart">${opt(["unknown","yes","no"],p.cart||"unknown",k=>k==="yes"?t("cartYes"):k==="no"?t("cartNo"):t("cartUnk"))}</select></label></div>
 <label>${t("f_alias")}<input id="f_alias" value="${esc(p.aliases||"")}"></label>
 <label>${t("f_notes")}<textarea id="f_notes">${esc(p.notes||"")}</textarea></label>
 ${p.updatedAt?`<div class="empty" style="padding:0">${t("upd")}: ${esc(fmtTime(p.updatedAt))}</div>`:""}
 <div class="row"><button class="btn red small" type="submit">${t("save")}</button>${p._new?"":`<button class="btn line small" type="button" id="fMove">${t("move")}</button><button class="btn ghost small" type="button" id="fDel">${t("del")}</button>`}</div></form></div>`}
function pathForm(p){return formHead(p._new?t("a_draw"):t("edit"))+`
 <form class="form" id="pf"><label>${t("f_pname")}<input id="f_pname" value="${esc(p.name||"")}" required></label>
 <div class="two"><label>${t("f_ptype")}<select id="f_ptype">${opt(["cart","walk"],p.type,k=>k==="cart"?t("cartPath"):t("walkPath"))}</select></label><label>${t("f_status")}<select id="f_status">${opt(["pending","approved","closed"],p.status,k=>t("s_"+k))}</select></label></div>
 <div class="alert info" style="font-size:12.5px">${esc(t("pathRule"))}</div>
 ${p.updatedAt?`<div class="empty" style="padding:0">${t("upd")}: ${esc(fmtTime(p.updatedAt))}</div>`:""}
 <div class="row"><button class="btn red small" type="submit">${t("save")}</button>${p._new?"":`<button class="btn ghost small" type="button" id="fDel">${t("del")}</button>`}</div></form></div>`}
function calForm(c){return formHead(t("a_calAdd"))+`
 <form class="form" id="pf"><label>${t("f_coords")}<input id="f_coords" dir="ltr" inputmode="decimal" placeholder="24.4672, 39.6111" required></label>
 <div class="empty" style="padding:0">${esc(t("f_coordsHint"))}</div>
 <div class="row"><button class="btn red small" type="submit">${t("save")}</button><button class="btn line small" type="button" id="fHere">${t("useHere")}</button></div></form></div>`}
function wireForm(){const E=S.editing;
 document.getElementById("fCx").onclick=()=>{S.editing=null;render()};
 const del=document.getElementById("fDel");if(del)del.onclick=()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent=t("confirmDel");return}
  const arr=E._path?ST.paths:ST.places;const i=arr.findIndex(x=>x.id===E.id);if(i>=0)arr.splice(i,1);toast(t("deleted"));S.editing=null;commit()};
 const mv=document.getElementById("fMove");if(mv)mv.onclick=()=>{S.placing={place:{...E,...readPlace()}};S.editing=null;render()};
 const hr=document.getElementById("fHere");if(hr)hr.onclick=()=>{if(!("geolocation" in navigator)){toast(t("gpsUnsupported"));return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById("f_coords").value=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6)},()=>toast(t("gpsDenied")),{enableHighAccuracy:true,timeout:20000})};
 document.getElementById("pf").onsubmit=ev=>{ev.preventDefault();
  if(E._cal){const m=String(document.getElementById("f_coords").value).replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).match(/(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)/);
   if(!m||Math.abs(+m[1])>90||Math.abs(+m[2])>180){toast(t("badCoords"));return}
   ST.calib=ST.calib||[];ST.calib.push({x:E.x,y:E.y,lat:+m[1],lng:+m[2]})}
  else if(E._path){const body={name:document.getElementById("f_pname").value.trim(),type:document.getElementById("f_ptype").value,status:document.getElementById("f_status").value,points:E.points,updatedAt:Date.now()};
   if(E._new)ST.paths.push({id:uid(),...body});else{const i=ST.paths.findIndex(x=>x.id===E.id);if(i>=0)ST.paths[i]={...ST.paths[i],...body}}}
  else{const body={...readPlace(),x:E.x,y:E.y,updatedAt:Date.now()};
   if(E._new||!E.id)ST.places.push({id:uid(),...body});else{const i=ST.places.findIndex(x=>x.id===E.id);if(i>=0)ST.places[i]={...ST.places[i],...body};else ST.places.push({id:E.id,...body})}}
  toast(t("saved"));S.editing=null;commit()}}
function readPlace(){const v=id=>document.getElementById(id).value.trim();return{num:v("f_num"),cat:v("f_cat"),nameAr:v("f_nameAr"),nameEn:v("f_nameEn"),zone:v("f_zone"),cart:v("f_cart"),aliases:v("f_alias"),notes:v("f_notes")}}
function cleanPlace(r){if(typeof r.x!=="number"||typeof r.y!=="number")return null;return{id:String(r.id||uid()),num:String(r.num??""),cat:CATS.includes(r.cat)?r.cat:"facility",nameAr:String(r.nameAr||""),nameEn:String(r.nameEn||""),zone:ZONES.includes(r.zone)?r.zone:"other",cart:["yes","no"].includes(r.cart)?r.cart:"unknown",aliases:String(r.aliases||""),notes:String(r.notes||""),x:r.x,y:r.y,updatedAt:r.updatedAt||Date.now()}}
function importJson(){let arr;try{arr=JSON.parse(document.getElementById("impTxt").value);if(!Array.isArray(arr))throw 0}catch(e){toast(t("badJson"));return}
 let n=0;for(const r of arr){const p=cleanPlace(r);if(p){ST.places.push(p);n++}}toast(t("importOk")+": "+n);commit()}

/* ---------- data package ---------- */
function pkg(){return{app:"golf-map",format:1,updatedAt:ST.updatedAt||Date.now(),places:ST.places,paths:ST.paths,calib:ST.calib||[],map:ST.map}}
function applyPkg(d,publishedAt){if(!d||!Array.isArray(d.places))throw new Error("bad");
 ST={places:d.places.map(cleanPlace).filter(Boolean),
  paths:(d.paths||[]).filter(p=>Array.isArray(p.points)).map(p=>({id:String(p.id||uid()),name:String(p.name||""),type:p.type==="walk"?"walk":"cart",status:["approved","closed"].includes(p.status)?p.status:"pending",points:p.points,updatedAt:p.updatedAt||0})),
  calib:(d.calib||[]).filter(c=>typeof c.lat==="number"&&typeof c.lng==="number"),
  map:d.map&&d.map.dataUrl?{dataUrl:d.map.dataUrl,w:+d.map.w,h:+d.map.h,name:String(d.map.name||""),updatedAt:d.map.updatedAt||0}:null,
  updatedAt:d.updatedAt||Date.now(),publishedAt:publishedAt||0,dirty:!publishedAt}}
function exportPkg(){const blob=new Blob([JSON.stringify(pkg())],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 ST.publishedAt=ST.updatedAt;ST.dirty=false;persist();render()}
async function importPkg(f){try{applyPkg(JSON.parse(await f.text()));await persist();toast(t("importOk"));lastMapKey="";render()}catch(e){toast(t("badJson"))}}

/* map upload: PDF page 1 → JPEG, or image as-is */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function uploadMap(file){
 const busy=document.createElement("div");busy.className="loading";busy.textContent=t("rendering");document.body.appendChild(busy);
 try{let c;
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
   const V3="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
   if(!window.pdfjsLib)await loadScript(V3+"pdf.min.js");
   const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=V3+"pdf.worker.min.js";
   const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;const page=await doc.getPage(1);
   const base=page.getViewport({scale:1});const sc=Math.min(4200/Math.max(base.width,base.height),Math.sqrt(13e6/(base.width*base.height)));
   const vpp=page.getViewport({scale:sc});c=document.createElement("canvas");c.width=Math.floor(vpp.width);c.height=Math.floor(vpp.height);
   const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:ctx,viewport:vpp}).promise}
  else{const u=URL.createObjectURL(file);const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});
   const k=Math.min(1,4200/Math.max(im.naturalWidth,im.naturalHeight));c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
   const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u)}
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  ST.map={dataUrl:await blobToDataUrl(blob),w:c.width,h:c.height,name:file.name,updatedAt:Date.now()};
  toast(t("mapSaved"));commit()}catch(e){console.error(e);toast(t("badJson"))}finally{busy.remove()}}

/* ---------- render ---------- */
let lastMapKey="";
function render(){
 header();renderTabs();
 const key=ST.map?("m"+ST.map.updatedAt):"demo";
 if(key!==lastMapKey){lastMapKey=key;img.src=ST.map?ST.map.dataUrl:DEMO_URL;img.width=W();img.height=H();stage.style.width=W()+"px";stage.style.height=H()+"px";requestAnimationFrame(()=>fitView(false))}
 vp.classList.toggle("placing",!!(S.placing||S.drawing||S.calibrating||(S.quiz&&!S.quiz.reveal)));
 if(S.sel){const fresh=places().find(p=>p.id===S.sel.id);S.sel=fresh||null;if(!fresh){S.route=null;S.routeErr=null}}
 renderMarkers();renderPaths();renderOverlay()}

/* ---------- boot ---------- */
async function boot(){
 render();
 await IDB.open();
 const saved=await IDB.get("store");if(saved&&Array.isArray(saved.places)){ST={...emptyStore(),...saved};lastMapKey="";render()}
 try{const r=await fetch("data.json",{cache:"no-cache"});if(r.ok){const d=await r.json();
   if(d&&d.app==="golf-map"&&d.updatedAt&&d.updatedAt!==ST.publishedAt&&!ST.dirty){applyPkg(d,d.updatedAt);await persist();lastMapKey="";render();if(saved)toast(t("updatedFrom"))}}}
 catch(e){if(saved&&location.protocol.startsWith("http"))toast(t("offline"))}
 if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
}
boot();
})();
</script>
